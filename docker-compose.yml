# Optional: containerized Postgres for local dev (native Homebrew Postgres is preferred)
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tx
      POSTGRES_PASSWORD: tx
      POSTGRES_DB: api
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
