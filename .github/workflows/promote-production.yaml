name: Promote Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to promote. Leave blank to promote the selected ref.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote production
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve promotion settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          raw_commit="${{ inputs.commit_sha }}"
          if [[ -z "$raw_commit" ]]; then
            raw_commit="${{ github.sha }}"
          fi

          commit_sha="$(git rev-parse "$raw_commit^{commit}")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a 40-character git commit SHA, got: $commit_sha" >&2
            exit 1
          fi

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${commit_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "downloads_stack_name=gx-downloads" >> "$GITHUB_OUTPUT"
          echo "stack_name=gx-server-production" >> "$GITHUB_OUTPUT"
          echo "cluster_name=gx-server-production" >> "$GITHUB_OUTPUT"
          echo "service_name=gx-server-production" >> "$GITHUB_OUTPUT"
          echo "staging_repository_name=gx-server-staging" >> "$GITHUB_OUTPUT"
          echo "production_repository_name=gx-server-production" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure production ECR repository
        env:
          ECR_REPOSITORY: ${{ steps.settings.outputs.production_repository_name }}
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE >/dev/null

      - name: Promote staging image
        env:
          COMMIT_SHA: ${{ steps.settings.outputs.commit_sha }}
          STAGING_REPOSITORY: ${{ steps.settings.outputs.staging_repository_name }}
          PRODUCTION_REPOSITORY: ${{ steps.settings.outputs.production_repository_name }}
        run: |
          set -euo pipefail
          image_json="$(aws ecr batch-get-image \
            --repository-name "$STAGING_REPOSITORY" \
            --image-ids "imageTag=$COMMIT_SHA" \
            --output json)"

          manifest="$(jq -r '.images[0].imageManifest // empty' <<< "$image_json")"
          media_type="$(jq -r '.images[0].imageManifestMediaType // empty' <<< "$image_json")"

          if [[ -z "$manifest" ]]; then
            echo "No staging image found for commit $COMMIT_SHA in $STAGING_REPOSITORY" >&2
            echo "Deploy that commit to staging first, then promote it." >&2
            exit 1
          fi

          put_image() {
            local tag="$1"
            if [[ -n "$media_type" ]]; then
              aws ecr put-image \
                --repository-name "$PRODUCTION_REPOSITORY" \
                --image-tag "$tag" \
                --image-manifest "$manifest" \
                --image-manifest-media-type "$media_type" >/dev/null
            else
              aws ecr put-image \
                --repository-name "$PRODUCTION_REPOSITORY" \
                --image-tag "$tag" \
                --image-manifest "$manifest" >/dev/null
            fi
          }

          put_image "$COMMIT_SHA"
          put_image production

      - name: Install infra dependencies
        working-directory: infra
        run: bun install --frozen-lockfile

      - name: Deploy downloads stack
        working-directory: infra
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          DOWNLOADS_STACK_NAME: ${{ steps.settings.outputs.downloads_stack_name }}
        run: |
          set -euo pipefail
          test -n "$DOMAIN_NAME"
          bun run cdk deploy "$DOWNLOADS_STACK_NAME" \
            -c "domainName=$DOMAIN_NAME" \
            --require-approval never

      - name: Deploy production stack
        working-directory: infra
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          STACK_NAME: ${{ steps.settings.outputs.stack_name }}
        run: |
          set -euo pipefail
          test -n "$DOMAIN_NAME"
          bun run cdk deploy "$STACK_NAME" \
            -c "domainName=$DOMAIN_NAME" \
            --require-approval never

      - name: Read production stack outputs
        id: outputs
        env:
          STACK_NAME: ${{ steps.settings.outputs.stack_name }}
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          echo "task_definition_family=$(output TaskDefinitionFamily)" >> "$GITHUB_OUTPUT"
          echo "container_name=$(output ContainerName)" >> "$GITHUB_OUTPUT"
          echo "private_subnet_ids=$(output PrivateSubnetIds)" >> "$GITHUB_OUTPUT"
          echo "security_group_ids=$(output ServiceSecurityGroupIds)" >> "$GITHUB_OUTPUT"
          echo "url=$(output Url)" >> "$GITHUB_OUTPUT"

      - name: Run production database migrations
        env:
          CLUSTER_NAME: ${{ steps.settings.outputs.cluster_name }}
          TASK_DEFINITION_FAMILY: ${{ steps.outputs.outputs.task_definition_family }}
          CONTAINER_NAME: ${{ steps.outputs.outputs.container_name }}
          PRIVATE_SUBNET_IDS: ${{ steps.outputs.outputs.private_subnet_ids }}
          SECURITY_GROUP_IDS: ${{ steps.outputs.outputs.security_group_ids }}
        run: |
          set -euo pipefail
          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET_IDS],securityGroups=[$SECURITY_GROUP_IDS],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"bun\",\"src/migrate.ts\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "Failed to start production migration task" >&2
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
            --output text)"

          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$task_arn"
            exit 1
          fi

      - name: Roll production ECS service
        env:
          CLUSTER_NAME: ${{ steps.settings.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.settings.outputs.service_name }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME"

      - name: Smoke test production
        env:
          URL: ${{ steps.outputs.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors "$URL/health"

      - name: Promotion summary
        env:
          COMMIT_SHA: ${{ steps.settings.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.settings.outputs.short_sha }}
          URL: ${{ steps.outputs.outputs.url }}
        run: |
          {
            echo "### Production promoted"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Version: \`$SHORT_SHA\`"
            echo "- URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
